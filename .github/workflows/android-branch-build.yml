name: android-release-branch-build

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Настроить подпись Android
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD_VALUE: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_VALUE: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${KEYSTORE_B64}" | base64 --decode > android/app/keystore.jks
          echo "keyAlias=${KEY_ALIAS_VALUE}" >> android/local.properties
          echo "storePassword=${STORE_PASSWORD_VALUE}" >> android/local.properties
          echo "keyPassword=${KEY_PASSWORD_VALUE}" >> android/local.properties

      - name: Настроить Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.0'
          cache-dependency-path: |
            core/go.sum

      - name: Кэшировать Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('core/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Настроить Java для Android/Gradle
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Настроить Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Определить Android NDK
        run: |
          latest_ndk="$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          if [ -z "${latest_ndk}" ]; then
            echo "ANDROID_NDK не найден в ${ANDROID_HOME}/ndk" >&2
            exit 1
          fi
          echo "ANDROID_NDK=${latest_ndk}" >> "${GITHUB_ENV}"

      - name: Получить зависимости Flutter
        run: |
          flutter --version
          flutter pub get

      - name: Проверить Flutter analyze
        run: flutter analyze lib test setup.dart

      - name: Запустить Android-регрессионные тесты
        run: flutter test test/common

      - name: Собрать Android-артефакты
        run: dart setup.dart android

      - name: Загрузить Android-артефакты
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-dist
          path: ./dist
          overwrite: true
